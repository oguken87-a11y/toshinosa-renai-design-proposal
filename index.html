<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="年の差恋愛『3つのつまずき診断』のデザイン提案" />
    <title>年の差恋愛「3つのつまずき診断」デザイン提案</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07101a;
        --line: rgba(255,255,255,.12);
        --accent: #ed9633;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-width: 320px;
        color: #f7f9fb;
        background:
          radial-gradient(circle at 10% 0%, rgba(28,67,95,.34), transparent 38rem),
          radial-gradient(circle at 92% 18%, rgba(237,150,51,.09), transparent 30rem),
          var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI",
          "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      }

      .topbar {
        padding: 20px clamp(16px,2.2vw,32px);
        border-bottom: 1px solid rgba(255,255,255,.1);
        background: rgba(8,17,28,.86);
      }

      .topbar-inner { width: min(1760px,100%); margin: 0 auto; }
      .eyebrow { margin: 0 0 4px; color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .22em; }
      .brand { margin: 0; font-size: clamp(14px,1.3vw,17px); font-weight: 700; }

      .content {
        width: min(1760px,100%);
        margin: 0 auto;
        padding: clamp(38px,5vw,58px) clamp(16px,2.2vw,32px) 80px;
      }

      .intro { margin-bottom: clamp(46px,6vw,76px); text-align: center; }
      .intro p { margin: 0 0 9px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .13em; }
      h1 { margin: 0; font-size: clamp(25px,3vw,42px); font-weight: 680; letter-spacing: .03em; }

      .concept-stack { display: flex; flex-direction: column; gap: clamp(74px,9vw,124px); }

      .concept-heading {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 22px;
        padding-bottom: 18px;
        border-bottom: 1px solid color-mix(in srgb,var(--concept-accent),transparent 55%);
      }

      .concept-letter {
        display: grid;
        width: 50px;
        height: 50px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        color: #07101a;
        background: var(--concept-accent);
        font-size: 19px;
        font-weight: 850;
      }

      .concept-kicker {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 4px;
        color: var(--concept-accent);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .18em;
      }

      .concept-kicker span { color: rgba(255,255,255,.34); letter-spacing: .08em; }
      h2 { margin: 0; font-size: clamp(20px,2vw,30px); line-height: 1.4; }

      .screens-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

      figure {
        overflow: hidden;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
        box-shadow: 0 22px 60px rgba(0,0,0,.23);
      }

      figcaption {
        display: flex;
        min-height: 66px;
        align-items: center;
        gap: 11px;
        padding: 11px 15px;
        border-bottom: 1px solid rgba(255,255,255,.1);
        color: rgba(255,255,255,.74);
        font-size: 12px;
        font-weight: 700;
      }

      .screen-number {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        color: #07101a;
        background: var(--concept-accent);
        font-size: 10px;
        font-weight: 850;
      }

      figcaption strong {
        display: block;
        margin-bottom: 1px;
        color: var(--concept-accent);
        font-size: 8px;
        letter-spacing: .15em;
      }

      .screen-crop { overflow: hidden; aspect-ratio: 1 / 2; background: #f7f5f0; }
      .screen-strip { display: block; width: 300%; max-width: none; height: 100%; object-fit: fill; }

      @media (min-width: 960px) {
        .screens-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
      }

      @media (max-width: 640px) {
        .content { padding-right: 10px; padding-left: 10px; }
        .concept-stack { gap: 72px; }
        .concept-heading { gap: 12px; margin-bottom: 16px; padding: 0 4px 14px; }
        .concept-letter { width: 42px; height: 42px; font-size: 17px; }
        h2 { font-size: 19px; }
        figure { border-radius: 15px; }
        figcaption { min-height: 60px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <p class="eyebrow">DESIGN PROPOSAL</p>
        <p class="brand">年の差恋愛「3つのつまずき診断」</p>
      </div>
    </header>

    <main class="content">
      <section class="intro">
        <p>3つのデザイン案</p>
        <h1>スタート・質問・結果画面</h1>
      </section>

      <div class="concept-stack">
        <section style="--concept-accent:#d17737" aria-labelledby="concept-a">
          <header class="concept-heading">
            <span class="concept-letter">A</span>
            <div><p class="concept-kicker">DESIGN A <span>01 / 03</span></p><h2 id="concept-a">信頼感のある編集デザイン</h2></div>
          </header>
          <div class="screens-grid">
            <figure><figcaption><span class="screen-number">01</span><span><strong>START</strong>スタート画面</span></figcaption><div class="screen-crop"><img class="screen-strip" src="assets/concept-a.png" alt="信頼感のある編集デザインのスタート画面"></div></figure>
            <figure><figcaption><span class="screen-number">02</span><span><strong>QUESTION</strong>質問画面</span></figcaption><div class="screen-crop"><img class="screen-strip" style="transform:translateX(-33.333333%)" src="assets/concept-a.png" alt="信頼感のある編集デザインの質問画面"></div></figure>
            <figure><figcaption><span class="screen-number">03</span><span><strong>RESULT</strong>結果画面</span></figcaption><div class="screen-crop"><img class="screen-strip" style="transform:translateX(-66.666666%)" src="assets/concept-a.png" alt="信頼感のある編集デザインの結果画面"></div></figure>
          </div>
        </section>

        <section style="--concept-accent:#d8b56c" aria-labelledby="concept-b">
          <header class="concept-heading">
            <span class="concept-letter">B</span>
            <div><p class="concept-kicker">DESIGN B <span>02 / 03</span></p><h2 id="concept-b">プレミアムな戦略デザイン</h2></div>
          </header>
          <div class="screens-grid">
            <figure><figcaption><span class="screen-number">01</span><span><strong>START</strong>スタート画面</span></figcaption><div class="screen-crop"><img class="screen-strip" src="assets/concept-b.png" alt="プレミアムな戦略デザインのスタート画面"></div></figure>
            <figure><figcaption><span class="screen-number">02</span><span><strong>QUESTION</strong>質問画面</span></figcaption><div class="screen-crop"><img class="screen-strip" style="transform:translateX(-33.333333%)" src="assets/concept-b.png" alt="プレミアムな戦略デザインの質問画面"></div></figure>
            <figure><figcaption><span class="screen-number">03</span><span><strong>RESULT</strong>結果画面</span></figcaption><div class="screen-crop"><img class="screen-strip" style="transform:translateX(-66.666666%)" src="assets/concept-b.png" alt="プレミアムな戦略デザインの結果画面"></div></figure>
          </div>
        </section>

        <section style="--concept-accent:#0d978e" aria-labelledby="concept-c">
          <header class="concept-heading">
            <span class="concept-letter">C</span>
            <div><p class="concept-kicker">DESIGN C <span>03 / 03</span></p><h2 id="concept-c">3つのつまずきが見える案内型デザイン</h2></div>
          </header>
          <div class="screens-grid">
            <figure><figcaption><span class="screen-number">01</span><span><strong>START</strong>スタート画面</span></figcaption><div class="screen-crop"><img class="screen-strip" src="assets/concept-c.png" alt="3つのつまずきが見える案内型デザインのスタート画面"></div></figure>
            <figure><figcaption><span class="screen-number">02</span><span><strong>QUESTION</strong>質問画面</span></figcaption><div class="screen-crop"><img class="screen-strip" style="transform:translateX(-33.333333%)" src="assets/concept-c.png" alt="3つのつまずきが見える案内型デザインの質問画面"></div></figure>
            <figure><figcaption><span class="screen-number">03</span><span><strong>RESULT</strong>結果画面</span></figcaption><div class="screen-crop"><img class="screen-strip" style="transform:translateX(-66.666666%)" src="assets/concept-c.png" alt="3つのつまずきが見える案内型デザインの結果画面"></div></figure>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
